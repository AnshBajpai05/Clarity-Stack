# Prometheus scrape config (§5.7). Targets the Backend's dependency-free /metrics
# endpoint (metrics.py) — HTTP counters/latency histogram + LLM token/cost accounting.
# Service names resolve on the compose network.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: clarity-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: clarity-backend

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
