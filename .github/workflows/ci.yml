name: CI

# Regression gate for the engine work plus build/deploy hygiene (§10.4).
#   backend          — pytest (in-memory SQLite, no network/models); also runs the
#                      §10.10 offline AI-eval golden gate via test_eval_harness.py.
#   satellite        — node --test (pure-fn delta diff).
#   frontend         — typecheck (tsc) + production build are hard gates; eslint is
#                      non-blocking (187 pre-existing no-explicit-any errors, tracked
#                      separately rather than wedged into this gate).
#   compose-validate — `docker compose config` lints the whole-stack compose so a broken
#                      service/env reference fails fast, without a heavy image build.
# All jobs are fast: none installs torch/transformers or touches a real DB/cluster.

on:
  push:
    branches: [main, "Clarity_Stack_**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    env:
      RUN_MIGRATIONS_ON_STARTUP: "0"   # import app without touching a DB
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend/requirements_ci.txt
      - name: Install minimal CI deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_ci.txt
      # Hard gate: real-bug rules only (undefined names, syntax, bad asserts/compares).
      # This set is clean today; ruff.toml documents the scope.
      - name: Lint — bug rules (ruff)
        run: ruff check . --select E9,F63,F7,F82 --exclude venv
      # Hard gate: full pyflakes (unused imports/vars, redefinitions). The ~44
      # pre-existing hits were cleaned, so this is blocking — keep it clean.
      - name: Lint — full pyflakes
        run: ruff check . --select F --exclude venv,tests
      - name: Run test suite + coverage gate
        run: pytest tests/ -q --cov --cov-config=.coveragerc --cov-fail-under=70

  satellite:
    name: Satellite (node --test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Satellite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Satellite/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Run test suite
        run: npm test

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Web/Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Web/Frontend/package-lock.json
      - name: Install deps
        run: npm ci
      # Hard gates: all clean today and must stay clean.
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (vitest)
        run: npm run test
      - name: Build
        run: npm run build
      # Non-blocking: 187 pre-existing eslint errors (mostly no-explicit-any).
      # Surfaced in the log so the debt is visible; flip to blocking once cleaned.
      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true

  compose-validate:
    name: Compose (validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # JWT_SECRET is the one required (no-default) variable in the compose file;
      # a dummy value lets `config` interpolate so it validates structure, not secrets.
      - name: Validate docker-compose.yml
        env:
          JWT_SECRET: ci-validate-only
        run: docker compose config -q
