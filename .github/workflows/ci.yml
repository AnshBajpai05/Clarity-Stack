name: CI

# Regression gate for the §16/§17 engine work. Backend = pytest (in-memory SQLite,
# no network, no models). Satellite = node --test (pure-fn delta diff). Both are
# fast because neither installs torch/transformers or touches a real DB/cluster.

on:
  push:
    branches: [main, "Clarity_Stack_**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    env:
      RUN_MIGRATIONS_ON_STARTUP: "0"   # import app without touching a DB
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Backend/requirements_ci.txt
      - name: Install minimal CI deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_ci.txt
      - name: Run test suite
        run: pytest tests/ -q

  satellite:
    name: Satellite (node --test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Satellite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Satellite/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Run test suite
        run: npm test
